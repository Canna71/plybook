[package]
name = "surreal-export"
version = "0.1.0"
edition = "2021"
description = "One-off export of the old ReChess SurrealDB database to JSON for the SQLite import"
publish = false

# Standalone: not part of the app, which no longer depends on SurrealDB.
[workspace]

[dependencies]
surrealdb = { version = "2.1.4", features = ["kv-rocksdb"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
